name: Whatsupp Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reassemble and validate complete Android project
        shell: bash
        run: |
          set -euo pipefail
          # Source is committed after the first successful bootstrap build.
          # Only reconstruct the source bundle on an empty project checkout.
          if [[ -f app/build.gradle.kts && -f app/src/main/AndroidManifest.xml ]]; then
            echo "Complete source tree already exists; bootstrap extraction skipped."
            exit 0
          fi
          cat bootstrap/part-*.b64 | tr -d '\r\n ' | base64 --decode > "$RUNNER_TEMP/Whatsupp-project.zip"
          unzip -t "$RUNNER_TEMP/Whatsupp-project.zip"
          mkdir -p "$RUNNER_TEMP/whatsupp-src"
          unzip -q "$RUNNER_TEMP/Whatsupp-project.zip" -d "$RUNNER_TEMP/whatsupp-src"
          test -f "$RUNNER_TEMP/whatsupp-src/Whatsupp/app/build.gradle.kts"
          test -f "$RUNNER_TEMP/whatsupp-src/Whatsupp/app/src/main/AndroidManifest.xml"
          # Keep the authoritative workflow already checked out from the repository.
          rm -rf "$RUNNER_TEMP/whatsupp-src/Whatsupp/.github"
          cp -a "$RUNNER_TEMP/whatsupp-src/Whatsupp/." "$GITHUB_WORKSPACE/"
          echo "Restored complete source tree."

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK without deprecated tools package
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print | sort -V | tail -n 1)"
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          license_status=${PIPESTATUS[1]}
          set -o pipefail
          test "$license_status" -eq 0
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify offline-only safety boundary
        run: |
          if grep -E '<uses-permission[^>]+android:name="android.permission.(INTERNET|SEND_SMS|CALL_PHONE|READ_CALL_LOG)"' app/src/main/AndroidManifest.xml; then
            echo "Unexpected communication permission found" >&2
            exit 1
          fi
          if grep -R -E 'SmsManager|ACTION_SENDTO|ACTION_CALL|ACTION_DIAL' app/src/main/java; then
            echo "Unexpected real messaging/calling integration found" >&2
            exit 1
          fi

      - name: Run unit tests
        run: gradle testDebugUnitTest

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Whatsupp-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Expand full Android source tree in repository
        run: |
          rm -rf bootstrap Whatsupp-bootstrap Whatsupp-source
          rm -f Whatsupp-Android-Project.tar.xz
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Add complete Whatsupp Android source tree"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Check stable signing configuration
        id: signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE" && -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Stable signing secrets are not configured; no signed release is published." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Restore stable release keystore
        if: steps.signing.outputs.ready == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/whatsupp-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/whatsupp-release.jks" >> "$GITHUB_ENV"

      - name: Build signed APK
        if: steps.signing.outputs.ready == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Publish latest signed APK
        if: steps.signing.outputs.ready == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Whatsupp Latest APK
          files: app/build/outputs/apk/release/app-release.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
